;==========================================================================
; The bus of the L7N bench for -b (src/main.cpp):
;
;     ./run.sh -b -B bench/L7N4_bus.cfg -t DIR
;
; Four single-axis LS Mecapion L7N drives, daisy-chained, the motors lying
; flat and unloaded. With -b the bus runs in OP with the drives kept off
; (power stage off), beside the simulated arm: the arm, its six joints and
; their torque limits, the tasks, the cycle, the send deadline and the
; sync mode all stay those of INDY7.cfg. The bench gives the timing of a
; real bus (frames through the NIC and four slaves), not a robot.
;
; Only [ECAT_MASTER] SLAVENUMBER and [AXIS0].. are read from this file; any
; other key is reported and ignored.
;
; Read from the drives with the IgH tool on 2026-11-13 (all four the same):
;   identity       vendor 0x00007595, product 0x00000000, revision 2
;   0x6502         0x3ED: CST supported (bit 9)
;   0x6076         1337: rated torque 1.337 N m
;   0x6072         3000: max torque 300.0 % of rated
;   0x1C32:04      0x0005: free run and DC SYNC0, no SM-synchronous mode
;   PDO assigned   0x1601 / 0x1A01; the controller maps its own (Indy7Joint.cpp)
; Conversions (Indy7Joint.cpp, eq. (2)): target = tau / GEAR / KT * KAPPA.
; 0x6071 and 0x6077 count 0.1 % of the rated torque, so KT = 1.337 (the
; rated torque) and KAPPA = 1000. ENCODER_RESOLUTION is that of a 19-bit
; encoder and was not read from the drive: with -b the positions of the bus
; are not used. TORQUE_LIMIT_U is low on purpose; the drives stay off.
;==========================================================================
[ECAT_MASTER]
SLAVENUMBER=4

[AXIS0]
NAME=L7N 0
VENDOR_ID=0x00007595
PRODUCT_CODE=0x00000000
SLAVE_TYPE=0
MOVE_CCW=0
DRIVE_MODE=10
ENCODER_RESOLUTION=524288
GEAR_RATIO=1
TRANSMISSION_RATIO=1.0
TORQUE_CONSTANT=1.337
CURRENT_RATIO=1000
HOME_POSITION_OFFSET=0
TORQUE_LIMIT_U=0.4

[AXIS1]
NAME=L7N 1
VENDOR_ID=0x00007595
PRODUCT_CODE=0x00000000
SLAVE_TYPE=0
MOVE_CCW=0
DRIVE_MODE=10
ENCODER_RESOLUTION=524288
GEAR_RATIO=1
TRANSMISSION_RATIO=1.0
TORQUE_CONSTANT=1.337
CURRENT_RATIO=1000
HOME_POSITION_OFFSET=0
TORQUE_LIMIT_U=0.4

